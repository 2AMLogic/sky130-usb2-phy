name: CI

# Three independent jobs, on every pull request and every push to `main`:
#
#   check-ci      -- this repo's real functional verification suite
#                    (`npm run check:ci`, wired to scripts/check-ci.sh):
#                    the pytest usbfs_model layer plus the cocotb/Icarus RTL
#                    testbenches driven through `klt functional-verification`.
#                    Needs a provisioned EDA toolchain; takes minutes.
#
#   flow-records  -- the digital-flow evidence lint (`npm run lint`, wired to
#                    .github/scripts/lint.sh): flow/check_records.py plus its
#                    own self-tests. Pure Python, no klt / PDK / OpenROAD, so
#                    it runs in seconds and still gates the PR.
#
#   signoff       -- the T1 tier-verdict freshness gate (issue #73):
#                    signoff/check.py re-grades signoff/block-manifest.json
#                    with the pinned released `klt` and fails on any drift
#                    from the committed signoff/signoff-report.json, so a
#                    manifest citation whose underlying artifact has changed
#                    fails the PR instead of silently rotting.
#
# They are deliberately separate: the evidence lint and the signoff gate must
# stay green (and stay fast) even when the heavy toolchain job is slow or its
# provisioning is broken, and a failure in one must not be reported as a
# failure of the others. See verification/README.md, flow/README.md,
# signoff/README.md, and docs/environment-setup.md.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ci:
    name: verification suite (npm run check:ci)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Layer 1/3 (verification/test_usbfs_model.py, pytest): protocol
      # reference + packet builders, no simulator required. actions/setup-python
      # gives us a pip that isn't PEP-668 "externally managed" (unlike the
      # distro python3 on the runner), so a plain `pip install` works.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest (Layer 1/3 dependency)
        run: python3 -m pip install pytest

      # --------------------------------------------------------------------
      # Layer 2 (cocotb/Icarus RTL testbenches, driven through `klt
      # functional-verification`): bootstrap the same toolchain documented,
      # verbatim, in docs/environment-setup.md, so this layer actually runs
      # in CI instead of being silently skipped (scripts/check-ci.sh skips
      # it with a warning -- but still exits 0 -- whenever `klt` is absent
      # from PATH; without the steps below, this job would only be
      # exercising the pytest layer while still reporting green).
      #
      # Deliberately NOT installed here: Yosys (`yowasp-yosys`) and the
      # sky130A PDK (`volare fetch`). Both are part of environment-setup.md's
      # full bootstrap, but they back `klt synthesize` (the docs/baseline.md
      # synthesis smoke test), which `scripts/check-ci.sh` never invokes --
      # it only calls `klt functional-verification` against the
      # `verification/request-*.json` cocotb testbenches, none of which
      # instantiate sky130 standard cells. Installing a PDK toolchain this
      # suite never exercises would add CI runtime/flakiness for zero
      # additional coverage, so it's left out on purpose. If a future issue
      # adds a synthesis check to `npm run check:ci`, this job will need
      # those steps added back in -- see docs/environment-setup.md ss4-5.
      # --------------------------------------------------------------------

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install klt (klayout-tools)
        run: |
          uv tool install klayout-tools
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Install cocotb into klt's own tool venv
        run: |
          uv pip install --python "$(uv tool dir)/klayout-tools/bin/python" cocotb
          "$(uv tool dir)/klayout-tools/bin/python" -c "import cocotb; print(cocotb.__version__)"

      - name: Confirm the RTL-layer toolchain is on PATH
        run: |
          klt --version
          iverilog -V

      # --------------------------------------------------------------------
      # Run the real verification suite. This must invoke the same command
      # a human/agent runs locally (`npm run check:ci` -> scripts/check-ci.sh)
      # -- not a stub -- so it fails the PR check whenever either layer
      # fails.
      # --------------------------------------------------------------------
      - name: Run verification suite (npm run check:ci)
        run: npm run check:ci

  # ------------------------------------------------------------------------
  # Digital-flow evidence lint (issue #11). Independent of `check-ci` above:
  # no klt, no PDK, no OpenROAD, no Icarus -- flow/check_records.py reads only
  # committed files. It enforces the append-only / required-field / corner-
  # coverage / freshness / timing-gate / DRC-deck-pinning rules that
  # flow/README.md defines, and runs its own self-tests (which prove the lint
  # actually fails on each condition rather than merely claiming to).
  # ------------------------------------------------------------------------
  flow-records:
    name: digital-flow evidence lint (npm run lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The append-only check compares every record present in the base ref
      # against the working tree, so the base ref's history must be present --
      # a default shallow clone would silently degrade that check to a skip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest (the lint's own self-tests)
        run: python3 -m pip install pytest

      # Resolve the ref the append-only rule is enforced against. On a PR that
      # is the base branch as GitHub reports it; on a push to main it is the
      # commit before the push. Fetched explicitly so `git show <ref>:<path>`
      # can read the base ref's record blobs.
      - name: Resolve the append-only base ref
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "FLOW_LINT_BASE_REF=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "FLOW_LINT_BASE_REF=${{ github.event.before || 'HEAD~1' }}" >> "$GITHUB_ENV"
          fi

      - name: Run the evidence lint (npm run lint)
        run: npm run lint

  # ------------------------------------------------------------------------
  # T1 tier-verdict freshness gate (issue #73, signoff/README.md).
  # Independent of the jobs above: no PDK, no OpenROAD, no Icarus --
  # signoff/check.py re-grades the committed block manifest with the pinned
  # released klt and requires the committed signoff-report.json to match
  # what the current tree grades to. It also re-hashes the artifact behind
  # the manifest's generic citation (docs/characterization.md), which
  # `klt signoff` itself cannot re-open -- klt compares pinned hashes
  # against the envelope's own recorded hash, never against the file.
  # ------------------------------------------------------------------------
  signoff:
    name: klt signoff (T1 tier-verdict freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep this pin in sync with signoff/toolchain.json and
      # signoff/check.py's GRADER_* constants: the committed report is only
      # byte-comparable when graded with the released registry wheel it was
      # committed from (same-version git snapshots have been observed to
      # grade differently -- klayout-tools#2216).
      - name: Install the pinned grading klt (klayout-tools)
        run: python3 -m pip install klayout-tools==0.5.0

      - name: Confirm the grading build is the pinned release
        run: klt version --format json

      - name: Re-grade the block manifest; require the committed report to match
        run: python3 signoff/check.py
